; qdcoop.ini -- Queen's Domain co-op mod configuration.
;
; Placement: beside QueensDomain-Win64-Shipping.exe (the same directory as
; winmm.dll).  A missing file is not an error: every value below is the built-in
; default, so the mod is installable without one.
;
; WHY EVERY WRITE PATH DEFAULTS OFF
; ---------------------------------
; The analysis corpus records this as testing discipline rather than caution:
; "One switch per subsystem, so one broken part does not block testing the rest."
; Layers 0-3 of the mod (verify, probe, mirror) only read.  Layers 4-6 write to
; the game's world, and each is enabled separately once it has been proven on a
; live two-machine session.  Turning everything on before the first run makes a
; crash indistinguishable from a bug in any one of six subsystems.
;
; WHAT IS PROVEN VERSUS WHAT IS EXPECTED
; --------------------------------------
; FlagSync rides `NamedSaveData`, which is closed (analysis gaps C2/C6/C7 and
; analysis/23-quest-progression-sync-map.md).  Everything else here rests on a
; runtime proof listed in mod/doc/API-GAPS.md; enable it after that proof passes.

[Local]
; 0 = load, verify the build, log the substrate and stop.  Useful for confirming
; an install without changing anything.
Enabled=1

; 0=error 1=warn 2=info 3=debug 4=trace.
; Trace enables the ProcessEvent hook, which is the widest hook in the process --
; turn it on only while tracing a specific Blueprint surface.
LogLevel=2

[Net]
; The relay.  127.0.0.1 is right for a two-instance test on one machine; on two
; machines it is the LAN address of the machine running qd-relay.
;
; Steam P2P is NOT used: analysis/07-verification.md measured steam_api64.dll as a
; delay-load import whose DLL is unreachable in this install, so the game runs with
; Steamworks absent.
RelayHost=127.0.0.1
RelayPort=47800

[Rules]
; --- write paths (default off) ------------------------------------------------
; Mirror NamedSaveData: host broadcasts the absolute set, peer applies, peer
; actions arrive as intents the host validates.  A value is never lowered.
FlagSync=1

; Mirror InventoryContents host -> peer: the host sends the whole key/item set
; (on change and at 1 Hz, split across ticks) and the peer grants only the
; difference through the game's own AddItemToInventory, reading every grant back
; with the native counter.  The peer's own pickups go back as cumulative INTENT
; kind 2, and its consumptions as cumulative INTENT kind 3, which the host removes
; through TryConsumingItemFromInventory.  Nothing is ever removed except a use the
; peer reported, and the grant target is reduced by an outstanding use so a body
; that crossed it on the wire cannot replenish it.
;
; OFF until proven live: this is the first write path that creates items rather
; than raising a counter, and the grant/removal are reflective Blueprint calls.  A
; refused grant is remembered and retried, never dropped.
InventorySync=0

; Mirror SavableActorStates (one-shot interactables: chests, doors, breakable
; barricades).  The container is a reflected map on the save object, so its offset is
; found at runtime, and writes go through the game's own SavableActor setter with a
; two-way read-back.  The in-level actor is refreshed once per changed GUID by clearing
; only MySaveData's logical length and running the game's own RestoreFromSave, so a
; door/chest visibly opens and a looted chest cannot be looted again.  Built, NOT yet
; proven live -- flip this after the SYNC-GAPS section 5.6 lines appear on both machines.
ActorStateSync=0

; Mirror placed world objects that are NOT SavableActors: chests (measured live:
; `SG_Chest_BP2 [SG_Chest_BP_C] savable=no guid=- index=-1`, its state is its own `Opened`
; bool), levers/switches, placed item pickups and gates.  The identity is the placed
; actor's cooked "<world>/<level>/<name>" path hash -- the same rule the placed-enemy
; identity uses -- because these objects have no GUID to key on.  The partner is put into
; the opened state through the Blueprint's VISUAL/restore entry and the object's own state
; bool; the interaction verb and every payout are never called, and the global counters
; (TotalChestsOpened) still ride FlagSync, so nothing is counted twice.
; Built, NOT yet proven live -- flip it after the SYNC-GAPS section 5.5 lines appear.
ObjectSync=0

; The world-interact coverage layer (qdinteract.h).  It rides on the two object lanes and
; adds: the complete door/breakable/secret-mechanism class survey (52/33/32 families, from
; the shipped pak); the class' own animation in BOTH directions (SetToOpenState(want),
; Activate/Deactivate, SetToFinalState, Break) so a door closes as well as opens and a
; breakable plays its break; and an explicit door visual after the savable restore, so the
; partner sees the opening rather than a snap.  A door that streamed in after the last body
; is re-applied.  Nothing here presses the interaction verb or pays out; breakable loot stays
; per-player.  OFF until proven live.
InteractSync=0

; Enemies: the host simulates; a peer's copy is driven by the host's rows (its AI off)
; while the host has that enemy alive, and runs on the peer's own AI otherwise.  Peer
; hits and peer-side kills go to the host as intents.  Built, NOT yet proven live.
EnemySync=0

; Spawn and drive a full-body actor for the remote player.  Needs the B7 live
; proof (the engine spawn pair, not a direct SpawnActor).
PuppetSync=0

; Dialogue: each player publishes who it is talking to; the NPC the partner is
; talking to cannot be started here (the game's own BlockInteract).  Both players may
; talk to different NPCs at once.  Built, NOT yet proven live.
DialogueSync=0

; The dialogue SPECTATOR (K_DIALOGUE_VIEW 0x50, qddialogue2.h).  The talking player
; publishes the cursor its own DialogueManager is showing (the asset's name, the sequence
; and entry index, the option count, and the option it picked); the partner drives ITS OWN
; game's dialogue widget with that cursor, blends its camera to the speaker, and locks its
; own movement for the duration -- then gives all three back when the conversation ends,
; the sender goes silent, the session drops, or the map changes.  Only DISPLAY functions
; are called, never StartDialogue / RunAction / SaveNamedData, so a turn-in or a gift
; still happens once, on the machine that owns the conversation; the outcomes arrive on
; the flag lane.  A player who is being HIT is not hijacked (they keep the camera and
; their legs), and the refusal is remembered for that publication so the 1 Hz republish
; does not re-decide it.
;
; PROVEN LIVE (mod/doc/features/dialogue.md, run 3): B's screen showed the game's own
; dialogue box -- speaker "Bored Knight" and the full line -- with the camera on the
; speaker and B's input locked; A's death ended the conversation and B logged
; `dialogue view: HIDE ... widget hidden=1 RunningDialogue cleared=1 dialogue ended=1`,
; `camera restored (ran=1)`, `input restored (ran=1)`; both machines survived.  The
; flags half crossed in BOTH banks during the conversation.  ONE OPEN ITEM: the rig
; cannot make A advance a line (the manager has no Continue UFunction), so "B follows
; the next line" is the only behaviour not measured; the cursor it would follow is on
; the wire and is exercised by 57 unit assertions.
DialogueView=1

; Spawn the remote body as the game's OWN PLAYER CLASS (`FS_PlayerChar_C`) instead of an
; engine SkeletalMeshActor: unpossessed and tickless, driven by the same
; transform/animation/weapon mirroring.  This is what makes the enemy Blueprints able to
; target and damage the partner at all -- their two cast gates admit only an
; `FS_PlayerChar_C` implementing `FB_DamageableInterface` (SYNC-RESEARCH 1b) -- and it
; turns on TargetPlayer steering and the spawner-respawn adoption.  Damage that lands on
; the body is forwarded to the machine that owns that player through the existing
; K_DAMAGE lane rather than applied locally.  The unproven part is the engine
; constructing a full gameplay Blueprint (its ReceiveBeginPlay runs), so it is OFF until
; a live run has shown the `player body:` lines listed in API-GAPS section 5, B7.
; Needs PuppetSync=1 for the actor and EnemySync=1 for the damage lane and the target.
PlayerBody=0

; Level-streaming union: load what is around BOTH players and never hide a level the
; other player is standing in (veto at ULevelStreaming::SetShouldBeVisible; hooked only
; when this is on).  Built, NOT yet proven live.
StreamUnion=0

; Travel coordination (G6).  Announces the map each machine is in and the destination
; actor it just used, follows an in-world teleport with FS_PlayerChar.TeleportToLocation,
; and follows a HARD map switch by calling the game's own
; GameInstance.LoadMapWithLoadingScreen (not OpenLevel).  Hard switches are a handshake:
; HARD_BEGIN -> each machine ARRIVED -> host RESUME.  This switch is INDEPENDENT of
; StreamUnion, so travel following works with the union off.
TravelSync=0

; Cutscenes / sequencer: publish the manager this machine is running; the other either
; plays the same manager (BeginCutsceneWithManager) or is held consistently with
; EnterCutsceneMode/ExitCutsceneMode and the input lock until ENDED.
CutsceneSync=0

; Moving world objects (elevators, platforms, Activatable movers).  Owner-authoritative:
; the nearer player's machine publishes the transform, the other applies it.  The
; follower never re-runs the mover's logic.
MoverSync=0

; A rider's place ON the platform, keyed by the platform's stable id (K_PLATFORM_RIDE).
; The companion of MoverSync: MOVERS says where the platform is, this says where the
; person standing on it is, IN THE PLATFORM'S OWN AXES, so the partner's body is rebuilt
; from the receiver's own copy of the platform.  Mover-relative samples are the only way
; a rider does not jitter: their absolute samples are their own staircase while a lift
; carries them.  Needs MoverSync=1 (the platform must be in the same place first).
PlatformRide=0

; Loot: one shared drop set keyed by the game's own {source, dropIndex}.  The host's set
; is authoritative; a drop taken by either player becomes a tombstone that hides the
; copy on the other machine.
LootSync=0

; Suspend saves: while a session is live the peer holds the game's own
; BlockSuspendSaves, and a suspend load it does take makes the host re-apply
; WORLD_FLAGS, ACTOR_STATES and INVENTORY immediately.
SuspendGuard=0

; Declines SetGamePaused while a session is live.  The menus DO pause this game
; (measured: Status/Inventory, Pause, Photo and Checkpoint all freeze
; UWorld::TimeSeconds), and a paused host stops ticking -- which the peer sees as
; a hang rather than as a pause.
SuppressMenuPause=0

; Combat visuals beyond equipment and melee arcs (EFFECT kind 5).  Copies EVERY
; player projectile class -- not just the daggers, the only ones that share an
; ancestor, but every gun, the crossbow bolt, the rocket, the spear and hammer
; throws, the arc projectiles and the travelling ground waves -- and plays the
; IMPACT system where the sender's own projectile stopped, plus the cast / charge /
; muzzle systems a player's action spawns as its own world actor.  All of it is
; visual: a Niagara system at a point, never an actor that could collide or damage,
; so damage authority stays exactly where it was.  Needs PuppetSync=1.
CombatVfx=0

; A death is per PLAYER, not a world event.  With this on the Game Over dispatch is
; REFUSED (it pauses this world and leads to a reload of BOTH players' world), the death
; pose plays, and after ~3.5 s the player is put back at ITS OWN last rest point with a
; maximum reduced by 10 % per death (90 / 80 / ... / 10 %, cleared by a rest).  The
; partner's world, enemies and progress are untouched: it only sees the body go down and
; come back.  The stacks survive save/quit in a mod-owned sidecar beside this instance's
; log.  OFF until a live run has shown the `respawn:` lines -- see
; mod/doc/features/death-respawn.md.
DeathRespawn=0

; Quest/key items only, in BOTH directions (mod/doc/features/progression.md).
; When on, the inventory mirror and the shared drop set are narrowed to entries under
; Items/KeyItems/ (plus any item whose ItemDefinition says ItemCategory::Keys).  Everything
; else -- consumables, weapons, accessories, treasure, money, normal loot -- stays per-player,
; and a normal drop one player picks up stays on the floor for the other.  The host's own USE
; of a key now reaches the partner too (through the game's own TryConsumingItemFromInventory),
; which the additive lane alone could not express.
; OFF until proven live.  With it OFF, every other lane behaves exactly as before.
QuestItemSync=0

; A kill pays BOTH players, exactly once each.  Each machine watches its own player's XP
; counter across a death and reports what its own game actually paid; the machine whose game
; paid nothing awards the reported amount through the game's own Player_GiveXP.  No award is
; ever derived from the enemy's data, and a kill the game did not pay for is not invented.
; OFF until proven live.
KillXPSync=0

; A save on one machine is a save on both.  The detector is the game's own save DISPATCH
; (SaveFunctions.SaveGameToDisk / GameInstance.GI_SaveGameToDisk), so a rest point, the
; autosave, a menu save and a scripted save all arrive.  Suspend saves and system saves are
; refused by name (qdsuspend.h owns the former; the latter is per-machine settings), and the
; mirror is deferred -- then reported if it cannot run -- during a load, a travel handshake,
; a menu, the local player's death, a cutscene, or a suspend write in progress.
; OFF until proven live.
PartnerSaveSync=0

; --- authority ---------------------------------------------------------------
; 1 = only the host writes world facts; a peer's action is a request.
; Do not set this to 0: two writers on one progression container is the failure
; that makes both saves wrong rather than one of them stale.
HostAuthoritative=1

; The relay is plaintext and unauthenticated in v1.  A non-loopback, non-private
; relay address is refused unless this is set, and the launcher prints why.
AllowPlaintextInternet=0

; --- tuning ------------------------------------------------------------------
SpawnAttemptsMax=5
; Capped at 20 by the wire format (24 rows in one packet measured at 30/s, which is
; above the state-application ceiling).  Lower it on a weak link.
EnemyRowsPerTick=20
; 30 or 60.  60 costs <10 KB/s and halves sample age.
PlayerHz=30
