; qdcoop.ini -- Queen's Domain co-op mod configuration.
;
; Placement: beside QueensDomain-Win64-Shipping.exe (the same directory as
; winmm.dll).  A missing file is not an error: every value below is the built-in
; default, so the mod is installable without one.
;
; WHY EVERY WRITE PATH DEFAULTS OFF
; ---------------------------------
; The analysis corpus records this as testing discipline rather than caution:
; "One switch per subsystem, so one broken part does not block testing the rest."
; Layers 0-3 of the mod (verify, probe, mirror) only read.  Layers 4-6 write to
; the game's world, and each is enabled separately once it has been proven on a
; live two-machine session.  Turning everything on before the first run makes a
; crash indistinguishable from a bug in any one of six subsystems.
;
; WHAT IS PROVEN VERSUS WHAT IS EXPECTED
; --------------------------------------
; FlagSync rides `NamedSaveData`, which is closed (analysis gaps C2/C6/C7 and
; analysis/23-quest-progression-sync-map.md).  Everything else here rests on a
; runtime proof listed in mod/doc/API-GAPS.md; enable it after that proof passes.

[Local]
; 0 = load, verify the build, log the substrate and stop.  Useful for confirming
; an install without changing anything.
Enabled=1

; 0=error 1=warn 2=info 3=debug 4=trace.
; Trace enables the ProcessEvent hook, which is the widest hook in the process --
; turn it on only while tracing a specific Blueprint surface.
LogLevel=2

[Net]
; The relay.  127.0.0.1 is right for a two-instance test on one machine; on two
; machines it is the LAN address of the machine running qd-relay.
;
; Steam P2P is NOT used: analysis/07-verification.md measured steam_api64.dll as a
; delay-load import whose DLL is unreachable in this install, so the game runs with
; Steamworks absent.
RelayHost=127.0.0.1
RelayPort=47800

[Rules]
; --- write paths (default off) ------------------------------------------------
; Mirror NamedSaveData: host broadcasts the absolute set, peer applies, peer
; actions arrive as intents the host validates.  A value is never lowered.
FlagSync=1

; Mirror InventoryContents host -> peer: the host sends the whole key/item set
; (on change and at 1 Hz, split across ticks) and the peer grants only the
; difference through the game's own AddItemToInventory, reading every grant back
; with the native counter.  The peer's own pickups go back as cumulative INTENT
; kind 2, and its consumptions as cumulative INTENT kind 3, which the host removes
; through TryConsumingItemFromInventory.  Nothing is ever removed except a use the
; peer reported, and the grant target is reduced by an outstanding use so a body
; that crossed it on the wire cannot replenish it.
;
; OFF until proven live: this is the first write path that creates items rather
; than raising a counter, and the grant/removal are reflective Blueprint calls.  A
; refused grant is remembered and retried, never dropped.
InventorySync=0

; Mirror SavableActorStates (one-shot interactables: chests, doors, breakable
; barricades).  The container is a reflected map on the save object, so its offset is
; found at runtime, and writes go through the game's own SavableActor setter with a
; two-way read-back.  The in-level actor is refreshed once per changed GUID by clearing
; only MySaveData's logical length and running the game's own RestoreFromSave, so a
; door/chest visibly opens and a looted chest cannot be looted again.  Built, NOT yet
; proven live -- flip this after the SYNC-GAPS section 5.6 lines appear on both machines.
ActorStateSync=0

; Enemies: the host simulates; a peer's copy is driven by the host's rows (its AI off)
; while the host has that enemy alive, and runs on the peer's own AI otherwise.  Peer
; hits and peer-side kills go to the host as intents.  Built, NOT yet proven live.
EnemySync=0

; Spawn and drive a full-body actor for the remote player.  Needs the B7 live
; proof (the engine spawn pair, not a direct SpawnActor).
PuppetSync=0

; Dialogue: each player publishes who it is talking to; the NPC the partner is
; talking to cannot be started here (the game's own BlockInteract).  Both players may
; talk to different NPCs at once.  Built, NOT yet proven live.
DialogueSync=0

; Level-streaming union: load what is around BOTH players and never hide a level the
; other player is standing in (veto at ULevelStreaming::SetShouldBeVisible; hooked only
; when this is on).  Built, NOT yet proven live.
StreamUnion=0

; Declines SetGamePaused while a session is live.  The menus DO pause this game
; (measured: Status/Inventory, Pause, Photo and Checkpoint all freeze
; UWorld::TimeSeconds), and a paused host stops ticking -- which the peer sees as
; a hang rather than as a pause.
SuppressMenuPause=0

; --- authority ---------------------------------------------------------------
; 1 = only the host writes world facts; a peer's action is a request.
; Do not set this to 0: two writers on one progression container is the failure
; that makes both saves wrong rather than one of them stale.
HostAuthoritative=1

; The relay is plaintext and unauthenticated in v1.  A non-loopback, non-private
; relay address is refused unless this is set, and the launcher prints why.
AllowPlaintextInternet=0

; --- tuning ------------------------------------------------------------------
SpawnAttemptsMax=5
; Capped at 20 by the wire format (24 rows in one packet measured at 30/s, which is
; above the state-application ceiling).  Lower it on a weak link.
EnemyRowsPerTick=20
; 30 or 60.  60 costs <10 KB/s and halves sample age.
PlayerHz=30
